name: Run checkov scan

on:
    workflow_dispatch:

permissions:
    contents: read 
    actions: read
jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: bridgecrewio/checkov-action@v12
              with:
                soft_fail: true
                skip_path: "./apps/nginx"

        
