apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pushsecret-dbpass # Customisable
  namespace: postgres-db
spec:
  updatePolicy: Replace 
  deletionPolicy: Delete 
  refreshInterval: 1h0m0s 
  secretStoreRefs: 
    - name: azure-kv-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: postgresql-app
  data:
    - conversionStrategy: None # Also supports the ReverseUnicode strategy
      match:
        # The secretKey is used within PushSecret (it should match key under spec.template.data)
        secretKey: pgpass
        remoteRef:
          remoteKey: pgpass-pushsecret # The destination secret object name (where the secret is going to be pushed)
          #property: best-pokemon-dst # The key within the destination secret object.