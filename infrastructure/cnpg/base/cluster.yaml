apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  labels:
    db: postgres
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  # Persistent storage configuration
  storage:
    # storageClass: csi-hostpath-sc
    size: 1Gi
#  enableSuperuserAccess: true
#  superuserSecret:
#    name: cnpg-superuser
  bootstrap:
    initdb:
      database: linkding
      owner: app
#      secret:
#        name: postgresql-app1
#      database: app
#      owner: appuser

# Backup properties
  backup:
    volumeSnapshot:
       className: csi-aws-vsc

  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: "barman-object-store"

  inheritedMetadata:
    labels:
      azure.workload.identity/use: "true"
  serviceAccountTemplate:
    metadata:
      annotations:
        azure.workload.identity/client-id: "5d91183a-6a85-4d43-8c9c-6be969c05c20"
      labels:
        azure.workload.identity/use: "true"
